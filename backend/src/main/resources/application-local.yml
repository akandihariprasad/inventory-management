spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:inventory_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never

  mail:
    host: localhost
    port: 1025
    username:
    password:

logging:
  level:
    com.inventory: DEBUG
    org.springframework.security: INFO

server:
  port: 8080
