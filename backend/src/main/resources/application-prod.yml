spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: jdbc:mysql://production-db:3306/latest_db_prod?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.inventory: INFO
    org.springframework.security: INFO

server:
  port: 8080
  error:
    include-stacktrace: never

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000