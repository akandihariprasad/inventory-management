<div class="approval-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Supplier Approval</h2>
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <div class="table-container">
                <mat-spinner *ngIf="loading" diameter="40" class="spinner"></mat-spinner>

                <table mat-table [dataSource]="dataSource" *ngIf="!loading">
                    <ng-container matColumnDef="companyName">
                        <th mat-header-cell *matHeaderCellDef> Company Name </th>
                        <td mat-cell *matCellDef="let supplier"> {{supplier.companyName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                        <td mat-cell *matCellDef="let supplier"> {{supplier.email}} </td>
                    </ng-container>

                    <ng-container matColumnDef="phone">
                        <th mat-header-cell *matHeaderCellDef> Phone </th>
                        <td mat-cell *matCellDef="let supplier"> {{supplier.phone}} </td>
                    </ng-container>

                    <ng-container matColumnDef="address">
                        <th mat-header-cell *matHeaderCellDef> Address </th>
                        <td mat-cell *matCellDef="let supplier"> {{supplier.address}} </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let supplier">
                            <span class="status-badge status-pending">PENDING</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let supplier">
                            <button mat-raised-button color="primary" (click)="approveSupplier(supplier.id)">
                                <mat-icon>check_circle</mat-icon> Approve
                            </button>
                            <button mat-raised-button color="warn" (click)="rejectSupplier(supplier.id)">
                                <mat-icon>cancel</mat-icon> Reject
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
