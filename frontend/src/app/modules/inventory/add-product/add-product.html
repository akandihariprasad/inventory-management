<div class="product-form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
                <div class="form-grid">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Product Name</mat-label>
                        <input matInput formControlName="name">
                        <mat-error *ngIf="productForm.get('name')?.hasError('required')">
                            Product name is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Category</mat-label>
                        <mat-select formControlName="category">
                            <mat-option *ngFor="let cat of categories" [value]="cat">
                                {{cat}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Unit</mat-label>
                        <mat-select formControlName="unit">
                            <mat-option *ngFor="let unit of units" [value]="unit">
                                {{unit}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Unit Price (Cost)</mat-label>
                        <input matInput type="number" formControlName="unitPrice">
                        <span matPrefix>₹ &nbsp;</span>
                        <mat-error *ngIf="productForm.get('unitPrice')?.hasError('required')">
                            Unit price is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Selling Price</mat-label>
                        <input matInput type="number" formControlName="sellingPrice">
                        <span matPrefix>₹ &nbsp;</span>
                        <mat-error *ngIf="productForm.get('sellingPrice')?.hasError('required')">
                            Selling price is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Current Stock</mat-label>
                        <input matInput type="number" formControlName="currentStock">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Minimum Stock Level</mat-label>
                        <input matInput type="number" formControlName="minimumStockLevel">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Description</mat-label>
                        <textarea matInput rows="3" formControlName="description"></textarea>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Image URL</mat-label>
                        <input matInput formControlName="imageUrl">
                    </mat-form-field>
                </div>

                <div class="form-actions">
                    <button mat-button type="button" routerLink="/inventory">Cancel</button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
                        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
                        <span *ngIf="!loading">{{ isEditMode ? 'Update' : 'Add' }}</span>
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
