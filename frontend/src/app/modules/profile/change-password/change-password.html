<div class="password-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Change Password</h2>
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Current Password</mat-label>
                    <input matInput [type]="hideCurrentPassword ? 'password' : 'text'"
                        formControlName="currentPassword">
                    <button mat-icon-button matSuffix type="button"
                        (click)="hideCurrentPassword = !hideCurrentPassword">
                        <mat-icon>{{hideCurrentPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error>Current password is required</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>New Password</mat-label>
                    <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword">
                    <button mat-icon-button matSuffix type="button" (click)="hideNewPassword = !hideNewPassword">
                        <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">
                        New password is required
                    </mat-error>
                    <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('pattern')">
                        Password must contain at least 8 characters, one uppercase, one lowercase, one number and one
                        special character
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirm New Password</mat-label>
                    <input matInput [type]="hideConfirmPassword ? 'password' : 'text'"
                        formControlName="confirmPassword">
                    <button mat-icon-button matSuffix type="button"
                        (click)="hideConfirmPassword = !hideConfirmPassword">
                        <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
                        Please confirm your password
                    </mat-error>
                    <mat-error *ngIf="passwordForm.hasError('mismatch')">
                        Passwords do not match
                    </mat-error>
                </mat-form-field>

                <div class="form-actions">
                    <button mat-button type="button" (click)="router.navigate(['/dashboard'])">Cancel</button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
                        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
                        <span *ngIf="!loading">Change Password</span>
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
