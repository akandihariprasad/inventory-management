<div class="reports-container">
    <h1>Dashboard Reports</h1>

    <div class="charts-section">
        <mat-card>
            <mat-card-header>
                <mat-card-title>Sales Revenue Trend (Last 30 Days)</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <canvas baseChart [data]="salesChartData" [options]="chartOptions" [type]="'line'">
                </canvas>
            </mat-card-content>
        </mat-card>

        <mat-card>
            <mat-card-header>
                <mat-card-title>Order Volume Trend (Last 30 Days)</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <canvas baseChart [data]="orderChartData" [options]="barChartOptions" [type]="'bar'">
                </canvas>
            </mat-card-content>
        </mat-card>
    </div>
</div>
