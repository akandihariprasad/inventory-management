<div class="report-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Inventory Summary Report</h2>
            </mat-card-title>
            <button mat-raised-button color="accent" type="button" (click)="loadInventoryReport()">
                <mat-icon>refresh</mat-icon> Refresh
            </button>
        </mat-card-header>

        <mat-card-content>
            <div class="table-container">
                <mat-spinner *ngIf="loading" diameter="40" class="spinner"></mat-spinner>

                <table mat-table [dataSource]="inventoryData" *ngIf="!loading">
                    <ng-container matColumnDef="productName">
                        <th mat-header-cell *matHeaderCellDef> Product Name </th>
                        <td mat-cell *matCellDef="let item"> {{item.productName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="sku">
                        <th mat-header-cell *matHeaderCellDef> SKU </th>
                        <td mat-cell *matCellDef="let item"> {{item.sku}} </td>
                    </ng-container>

                    <ng-container matColumnDef="currentStock">
                        <th mat-header-cell *matHeaderCellDef> Current Stock </th>
                        <td mat-cell *matCellDef="let item"> {{item.currentStock}} </td>
                    </ng-container>

                    <ng-container matColumnDef="minimumStockLevel">
                        <th mat-header-cell *matHeaderCellDef> Min Stock Level </th>
                        <td mat-cell *matCellDef="let item"> {{item.minimumStockLevel}} </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let item">
                            <span class="status-badge" [class]="getStatusClass(item.status)">
                                {{item.status}}
                            </span>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
