<div class="sales-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Sales Orders</h2>
            </mat-card-title>
            <button mat-raised-button color="primary" routerLink="/sales/create">
                <mat-icon>add</mat-icon> New Sale
            </button>
        </mat-card-header>

        <mat-card-content>
            <!-- Search -->
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Search Orders</mat-label>
                <input matInput (keyup)="applyFilter()" placeholder="Search by customer or ID" [(ngModel)]="searchText">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <!-- Table -->
            <div class="table-container">
                <mat-spinner *ngIf="loading" diameter="40" class="spinner"></mat-spinner>

                <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Invoice # </th>
                        <td mat-cell *matCellDef="let order"> #{{order.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="customerName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Customer </th>
                        <td mat-cell *matCellDef="let order"> {{order.customerName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="totalAmount">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Sub Total </th>
                        <td mat-cell *matCellDef="let order"> {{order.totalAmount | currency:'INR'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="finalAmount">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Final Amount </th>
                        <td mat-cell *matCellDef="let order"> {{order.finalAmount | currency:'INR'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="paymentMode">
                        <th mat-header-cell *matHeaderCellDef> Payment Mode </th>
                        <td mat-cell *matCellDef="let order">
                            <span class="payment-badge">{{order.paymentMode}}</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="createdAt">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                        <td mat-cell *matCellDef="let order"> {{order.createdAt | date:'medium'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let order">
                            <button mat-icon-button color="primary" (click)="viewInvoice(order.id)">
                                <mat-icon>receipt</mat-icon>
                            </button>
                            <button mat-icon-button color="accent" (click)="printInvoice(order.id)">
                                <mat-icon>print</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="7">No sales orders found</td>
                    </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]"></mat-paginator>
            </div>
        </mat-card-content>
    </mat-card>
</div>
