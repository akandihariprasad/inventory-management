<div class="invite-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Invite Staff Member</h2>
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Full Name</mat-label>
                    <input matInput formControlName="name">
                    <mat-error *ngIf="inviteForm.get('name')?.hasError('required')">
                        Name is required
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email Address</mat-label>
                    <input matInput type="email" formControlName="email">
                    <mat-error *ngIf="inviteForm.get('email')?.hasError('required')">
                        Email is required
                    </mat-error>
                    <mat-error *ngIf="inviteForm.get('email')?.hasError('email')">
                        Invalid email format
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Role</mat-label>
                    <mat-select formControlName="role">
                        <mat-option *ngFor="let role of roles" [value]="role.value">
                            {{role.label}}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="inviteForm.get('role')?.hasError('required')">
                        Role is required
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Department (Optional)</mat-label>
                    <mat-select formControlName="departmentId">
                        <mat-option [value]="null">None</mat-option>
                        <mat-option *ngFor="let dept of departments" [value]="dept.id">
                            {{dept.name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="form-actions">
                    <button mat-button type="button" routerLink="/staff">Cancel</button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
                        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
                        <span *ngIf="!loading">Send Invitation</span>
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
