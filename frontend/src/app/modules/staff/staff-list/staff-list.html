<div class="staff-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Staff Management</h2>
            </mat-card-title>
            <button mat-raised-button color="primary" routerLink="/staff/invite">
                <mat-icon>person_add</mat-icon> Invite Staff
            </button>
        </mat-card-header>

        <mat-card-content>
            <div class="table-container">
                <mat-spinner *ngIf="loading" diameter="40" class="spinner"></mat-spinner>

                <table mat-table [dataSource]="staffList" *ngIf="!loading">
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> Name </th>
                        <td mat-cell *matCellDef="let staff"> {{staff.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                        <td mat-cell *matCellDef="let staff"> {{staff.email}} </td>
                    </ng-container>

                    <ng-container matColumnDef="role">
                        <th mat-header-cell *matHeaderCellDef> Role </th>
                        <td mat-cell *matCellDef="let staff">
                            <span class="role-badge">{{staff.role}}</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="department">
                        <th mat-header-cell *matHeaderCellDef> Department </th>
                        <td mat-cell *matCellDef="let staff"> {{staff.departmentName || '-'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let staff">
                            <span class="status-badge" [class.active]="staff.isActive"
                                [class.inactive]="!staff.isActive">
                                {{staff.isActive ? 'Active' : 'Inactive'}}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let staff">
                            <button mat-icon-button [color]="staff.isActive ? 'warn' : 'primary'"
                                (click)="toggleStatus(staff)">
                                <mat-icon>{{staff.isActive ? 'block' : 'check_circle'}}</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
