<div class="connections-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                <h2>Connection Requests</h2>
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <div class="table-container">
                <mat-spinner *ngIf="loading" diameter="40" class="spinner"></mat-spinner>

                <table mat-table [dataSource]="dataSource" *ngIf="!loading">
                    <ng-container matColumnDef="companyName">
                        <th mat-header-cell *matHeaderCellDef> Company Name </th>
                        <td mat-cell *matCellDef="let conn"> {{conn.companyName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let conn">
                            <span class="status-badge" [class]="getStatusClass(conn.status)">
                                {{conn.status}}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="createdAt">
                        <th mat-header-cell *matHeaderCellDef> Requested On </th>
                        <td mat-cell *matCellDef="let conn"> {{conn.createdAt | date:'medium'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let conn">
                            <button mat-raised-button color="primary" size="small"
                                (click)="updateStatus(conn.id, 'ACCEPTED')" *ngIf="conn.status === 'PENDING'">
                                Accept
                            </button>
                            <button mat-raised-button color="warn" size="small"
                                (click)="updateStatus(conn.id, 'REJECTED')" *ngIf="conn.status === 'PENDING'">
                                Reject
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
