<div class="chatbot-container">
    <!-- Chat Button -->
    <div class="chat-button-wrapper" [class.open]="isOpen">
        <button class="chat-button" (click)="toggleChat()">
            <mat-icon *ngIf="!isOpen">chat</mat-icon>
            <mat-icon *ngIf="isOpen">close</mat-icon>
            <span class="notification-badge" *ngIf="unreadCount > 0 && !isOpen">{{ unreadCount }}</span>
        </button>
    </div>

    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen" [@slideInOut] [class.minimized]="isMinimized">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-info" (click)="toggleMinimize()" style="cursor: pointer;">
                <div class="avatar">
                    <mat-icon>smart_toy</mat-icon>
                    <div class="online-status"></div>
                </div>
                <div class="info">
                    <h3>Inventory Assistant</h3>
                    <p>Online • Ready to help</p>
                </div>
            </div>
            <div class="chat-header-actions">
                <button mat-icon-button (click)="toggleMinimize()" matTooltip="Minimize">
                    <mat-icon *ngIf="!isMinimized">remove</mat-icon>
                    <mat-icon *ngIf="isMinimized">add</mat-icon>
                </button>
                <button mat-icon-button (click)="clearChat()" matTooltip="Clear Chat">
                    <mat-icon>delete_sweep</mat-icon>
                </button>
                <button mat-icon-button (click)="toggleChat()" matTooltip="Close">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>

        <!-- Chat Content (Hidden when minimized) -->
        <div class="chat-content" *ngIf="!isMinimized">
            <!-- Messages -->
            <div class="chat-messages" #chatMessages>
                <div *ngFor="let message of messages; let last = last" class="message-wrapper"
                    [class.user-message]="!message.intent && message.intent !== 'WELCOME'"
                    [class.bot-message]="message.intent || message.intent === 'WELCOME'" [@fadeIn]>
                    <div class="message-avatar">
                        <mat-icon *ngIf="message.intent || message.intent === 'WELCOME'">smart_toy</mat-icon>
                        <mat-icon *ngIf="!message.intent && message.intent !== 'WELCOME'">person</mat-icon>
                    </div>
                    <div class="message-bubble">
                        <div class="message-text" [innerHTML]="message.message | replaceNewline"></div>
                        <div class="message-time">{{ formatTime(message.timestamp) }}</div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="message-wrapper bot-message" *ngIf="isLoading">
                    <div class="message-avatar">
                        <mat-icon>smart_toy</mat-icon>
                    </div>
                    <div class="message-bubble typing-indicator">
                        <span></span><span></span><span></span>
                        <span class="typing-text">AI is thinking</span>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions" *ngIf="!isLoading">
                <div class="quick-actions-scroll">
                    <button *ngFor="let action of quickActions" class="quick-action-btn"
                        [style.background]="action.color" (click)="quickAction(action.action)">
                        <mat-icon>{{ action.icon }}</mat-icon>
                        <span>{{ action.label }}</span>
                    </button>
                </div>
            </div>

            <!-- Suggestions -->
            <div class="chat-suggestions" *ngIf="suggestions.length > 0 && !isLoading">
                <div class="suggestion-title">
                    <mat-icon>tips_and_updates</mat-icon>
                    <span>Suggested</span>
                </div>
                <div class="suggestion-chips">
                    <button *ngFor="let suggestion of suggestions" class="suggestion-chip"
                        (click)="sendSuggestion(suggestion)">
                        {{ suggestion }}
                    </button>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input">
                <form [formGroup]="messageForm" (ngSubmit)="sendMessage()">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Type your message...</mat-label>
                        <textarea matInput formControlName="message" (keydown.enter)="handleKeyPress($event)" rows="1"
                            #chatInput placeholder="Ask me anything about inventory management..."></textarea>
                        <button mat-icon-button matSuffix type="submit"
                            [disabled]="!messageForm.get('message')?.value || isLoading" class="send-btn">
                            <mat-icon>send</mat-icon>
                        </button>
                    </mat-form-field>
                </form>
            </div>
        </div>
    </div>
</div>
